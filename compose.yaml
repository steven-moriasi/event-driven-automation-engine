services:
  db:
    image: postgres:17.5-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_engine
      POSTGRES_USER: event_engine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_engine -d event_engine"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - event-engine-data:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: &application-environment
      EVENT_ENGINE_ENVIRONMENT: development
      EVENT_ENGINE_DATABASE_URL: postgresql+psycopg://event_engine:${POSTGRES_PASSWORD:-local-development-only}@db:5432/event_engine
      EVENT_ENGINE_WEBHOOK_SECRETS: ${EVENT_ENGINE_WEBHOOK_SECRETS:-{"partner":"local-webhook-secret"}}
      EVENT_ENGINE_DELIVERY_SIGNING_SECRET: ${EVENT_ENGINE_DELIVERY_SIGNING_SECRET:-local-delivery-secret}
      EVENT_ENGINE_GITHUB_TOKEN: ${EVENT_ENGINE_GITHUB_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    restart: unless-stopped
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EVENT_ENGINE_API_PORT:-8002}:8000"

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *application-environment
    expose:
      - "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

  reaper:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.reaper"]
    environment: *application-environment
    expose:
      - "9100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  event-engine-data:
