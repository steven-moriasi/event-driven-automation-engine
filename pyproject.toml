[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "event-driven-automation-engine"
version = "0.1.0"
description = "Reference implementation for durable at-least-once event delivery"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Steven Ongati", email = "ongatisteven@gmail.com" }]
dependencies = [
  "alembic==1.16.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.3.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "structlog==25.4.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.1",
  "pytest==8.4.0",
  "pytest-cov==6.1.1",
  "ruff==0.11.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
