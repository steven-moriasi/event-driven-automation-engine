name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check app tests alembic
      - run: mypy app tests
      - run: >-
          pytest --cov=app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=80

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: event_engine
          POSTGRES_USER: event_engine
          POSTGRES_PASSWORD: event_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_engine -d event_engine"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      EVENT_ENGINE_DATABASE_URL: postgresql+psycopg://event_engine:event_engine@localhost:5432/event_engine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: event-driven-automation-engine:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
